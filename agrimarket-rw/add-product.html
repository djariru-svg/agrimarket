<!DOCTYPE html>
<html lang="rw">
<head>
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>PAGE_TITLE — AgriMarket RW</title>
  <meta name="robots" content="noindex, nofollow"> <!-- ⚠️ Private pages -->
  <meta name="description" content="PAGE_DESCRIPTION">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/seo.css">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-seedling"></i> AgriMarket <span>RW</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Ahabanza</a>
        <a href="products.html">Ibicuruzwa</a>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="#" id="cartBtn"><i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span></a>
        <a href="#" id="authBtn" class="btn-nav">Injira</a>
      </div>
      <div class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </nav>

  <section class="page-header">
    <div class="container">
      <h1>Ongeraho Igicuruzwa Gishya</h1>
      <p>Shyira umusaruro wawe ku isoko</p>
    </div>
  </section>

  <section class="dashboard">
    <div class="container">
      <form id="addProductForm" class="add-product-form">
        <h2><i class="fas fa-plus-circle"></i> Amakuru y'Igicuruzwa</h2>

        <div class="form-group">
          <label>Izina ry'Igicuruzwa *</label>
          <input type="text" id="prodName" required placeholder="Urugero: Ibihaza, Amashaza...">
        </div>

        <div class="form-group">
          <label>Icyiciro *</label>
          <select id="prodCategory" required>
            <option value="">Hitamo icyiciro</option>
            <option value="Imboga">Imboga</option>
            <option value="Ibinyampeke">Ibinyampeke</option>
            <option value="Imyumbati">Imyumbati</option>
            <option value="Imyaka">Imyaka</option>
            <option value="Amata">Amata</option>
            <option value="Ibindi">Ibindi</option>
          </select>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div class="form-group">
            <label>Igiciro (RWF) *</label>
            <input type="number" id="prodPrice" required min="1" placeholder="500">
          </div>
          <div class="form-group">
            <label>Unit *</label>
            <input type="text" id="prodUnit" required placeholder="kg, liter, bunch...">
          </div>
        </div>

        <div class="form-group">
          <label>Ingano iboneka *</label>
          <input type="number" id="prodQty" required min="1" placeholder="100">
        </div>

        <div class="form-group">
          <label>Ahantu (Umudugudu / Sector) *</label>
          <input type="text" id="prodLocation" required placeholder="Urugero: Musanze, Huye...">
        </div>

        <div class="form-group">
          <label>Icon (Emoji)</label>
          <input type="text" id="prodIcon" placeholder="🥬 🍅 🌽 🍌 🥛 🍠" maxlength="2">
        </div>

        <div class="form-group">
          <label>Ibisobanuro</label>
          <textarea id="prodDesc" rows="3" placeholder="Sobanura umusaruro wawe..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-check"></i> Shyira ku Isoko
        </button>
        <a href="dashboard.html" class="btn btn-outline" style="display:block;text-align:center;margin-top:12px;border-color:var(--primary);color:var(--primary);">
          Subira inyuma
        </a>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 AgriMarket RW</p>
      </div>
    </div>
  </footer>

  <div class="modal" id="authModal">
    <div class="modal-content">
      <span class="close-modal" id="closeAuth">&times;</span>
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Injira</button>
        <button class="auth-tab" data-tab="register">Iyandikishe</button>
      </div>
      <form id="loginForm" class="auth-form">
        <h3>Injira</h3>
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
        <button type="submit" class="btn btn-primary btn-block">Injira</button>
      </form>
      <form id="registerForm" class="auth-form" style="display:none;">
        <h3>Iyandikishe</h3>
        <div class="form-group"><label>Amazina</label><input type="text" id="regName" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
        <div class="form-group"><label>Telefoni</label><input type="tel" id="regPhone" required></div>
        <div class="form-group"><label>Akarere</label>
          <select id="regDistrict" required>
            <option value="Kigali">Kigali</option>
            <option value="Northern">Northern</option>
            <option value="Southern">Southern</option>
            <option value="Eastern">Eastern</option>
            <option value="Western">Western</option>
          </select>
        </div>
        <div class="form-group"><label>Role</label>
          <select id="regRole"><option value="farmer">Farmer</option><option value="buyer">Buyer</option></select>
        </div>
        <div class="form-group"><label>Password</label><input type="password" id="regPassword" required></div>
        <button type="submit" class="btn btn-primary btn-block">Iyandikishe</button>
      </form>
    </div>
  </div>

  <div class="modal" id="cartModal">
    <div class="modal-content cart-modal">
      <span class="close-modal" id="closeCart">&times;</span>
      <h2>Agasanduku</h2>
      <div id="cartItems"></div>
      <div class="cart-total">
        <h3>Total: <span id="cartTotal">0</span></h3>
        <button class="btn btn-primary btn-block" id="checkoutBtn">Checkout</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script>
  </script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
